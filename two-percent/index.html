<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百分之二</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0c0b; --ui:#efe7d6; --ui-dim:rgba(239,231,214,.55); }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; }
  #stage { position:relative; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:absolute; left:0; right:0; bottom:0; padding:14px 18px; display:flex; gap:14px; align-items:center;
         background:linear-gradient(transparent, rgba(0,0,0,.55)); color:var(--ui); font-size:13px;
         opacity:0; transition:opacity .3s; }
  #stage.ui #bar, #stage.paused #bar { opacity:1; }
  #bar button { background:none; border:1px solid var(--ui-dim); color:var(--ui); font:inherit; padding:5px 10px; cursor:pointer; border-radius:3px; }
  #bar button:hover { border-color:var(--ui); }
  #seek { flex:1; position:relative; height:22px; cursor:pointer; }
  #seek .track { position:absolute; left:0; right:0; top:10px; height:2px; background:var(--ui-dim); }
  #seek .fill { position:absolute; left:0; top:10px; height:2px; background:var(--ui); }
  #seek .mark { position:absolute; top:6px; width:1px; height:10px; background:var(--ui); }
  #time { min-width:96px; text-align:right; font-variant-numeric:tabular-nums; }
  #start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #start span { color:#25231f; border:1.5px solid #25231f; padding:10px 22px; font-size:15px; letter-spacing:.2em; background:rgba(239,231,214,.85); margin-top:38%; }
  #start.hidden { display:none; }
</style>
</head>
<body>
<div id="stage" class="paused">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="start"><span>▶ 播放（含声音）</span></div>
  <div id="bar">
    <button id="play">播放</button>
    <div id="seek"><div class="track"></div><div class="fill"></div></div>
    <span id="time">0:00 / 0:00</span>
    <button id="speed">1×</button>
    <button id="subs">字幕 开</button>
    <button id="fs">全屏</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   《百分之二》 Two Percent — 纯代码短片
   全部画面由 Canvas 2D 按时间 t 确定性绘制（可任意拖动 / 逐帧导出）。
   旁白时长目前按语速估算；配音回来后，改 RATE 或给单句写死 dur 即可重新对位。
   ===================================================================== */

const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  paper: '#efe7d6', ink: '#25231f', ink2: '#6f665a', red: '#a33a28',
  blue: '#2f5f8f',                 // 蓝铅笔：只代表 AI 与关于 AI 的预测
  hl: 'rgba(242,198,60,0.62)',     // 荧光笔：只代表人、快不了的环节
  // 红：只代表访谈里的真实数字；黑：历史与事实
  grid: 'rgba(120,100,60,0.10)', gridMajor: 'rgba(120,100,60,0.22)',
};
const SERIF = '"Noto Serif SC","Songti SC","STSong","WenQuanYi Zen Hei",serif';
const MONO = '"IBM Plex Mono","Courier New",monospace';

/* ---------------- 旁白 / 时间轴 ----------------
   每句：[文字, 句后额外停顿秒数, 选项]
   选项 noSub：该句由画面上的字承担，不出底部字幕。                     */
const RATE = 4.3;   // 估算语速：字/秒
const GAP = 0.55;   // 句间默认停顿

const CHAPTERS = [
  { key: 'title', name: '', lead: 0.6, tail: 4.2, lines: [] },
  { key: 'ask', name: '一 · 你被问过吗', lead: 1.0, tail: 1.2, lines: [
    ['这个问题你大概被问过，或者问过别人：', 0],
    ['你学这个专业，以后会不会被 AI 取代？', 0.8, { noSub: true }],
    ['今年，Anthropic 的首席经济学家在哈佛被问了一个小时。', 0.2],
    ['他的回答，不太像你想的那样。', 0],
  ]},
  { key: 'half', name: '二 · 对了一半', lead: 1.2, tail: 1.6, lines: [
    ['几年前，一些人在图上画了一条线，说：到 2026 年，AI 会聪明到这种程度。', 0.6],
    ['他们说对了，甚至说保守了。', 0.6],
    ['他们还说，到那时，很多工作会消失。', 0.4],
    ['这一半没发生。美国的失业率是 4.1%，接近有记录以来的最低。', 0.6],
    ['同一批人，一半说对了，一半没对。为什么？', 0.8],
  ]},
  { key: 'chain', name: '三 · 工作是一串事', lead: 1.0, tail: 1.8, lines: [
    ['他的解释是：工作不是一件事，是一串事。', 0.8],
    ['AI 能让“想”和“写”快一百倍，但有些事快不了——它们要等现实世界给答案。', 0.8],
    ['打个比方，做一款新药。AI 一天能设计出成千上万种候选分子。', 0.4],
    ['但每一种都要先在动物身上试，再在人身上试，一期、二期、三期，几年起步。', 0.4],
    ['前面快了一百倍，新药上市只快了一点点。', 1.0],
    ['就像一场接力赛：前三棒跑得再快，第四棒还是原来的速度，全队的成绩就被它卡住。', 1.4],
    ['他给了一个真实的数字：编程 AI 普及以后，代码多了二十倍，', 0.2],
    ['真正发布的软件，只多了三成。', 0.8],
    ['中间差的那一大截，就是链条上快不了的那几环。', 0.6],
  ]},
  { key: 'line', name: '四 · 那条线', lead: 1.0, tail: 1.6, lines: [
    ['这是美国经济从 1870 年到 2010 年的样子。', 1.2],
    ['中间出现了电、汽车、电脑、互联网，每一次都有人说这次不一样。', 1.6],
    ['但平均下来，一百四十年，每年增长大约 2%。经济学家管它叫“经济的标度律”。', 1.4],
    ['这次会弯吗？他没有给答案。', 1.0],
    ['也许 AI 只是又一批让它保持在 2% 的发明。也许不是。', 1.0],
  ]},
  { key: 'swap', name: '五 · 不是消失，是换人', lead: 1.0, tail: 1.8, lines: [
    ['但有一件事，他承认得很直接。', 0.3],
    ['主持人问他：我现在用 AI 做研究，那我以前的研究助理呢？', 0.6],
    ['他说：你变强了，他的位子没了。两件事同时发生。', 1.2],
    ['这件事正在很多办公室里发生。', 0.2],
    ['同样的活，一个人六点就交了三份，另一个人九点才交一份。转正只有一个名额。', 1.2],
    ['工作没有消失。它只是换了人做。', 1.2],
    ['所以比起你的专业叫什么，更要紧的是：你是这两个人里的哪一个。', 1.0],
  ]},
  { key: 'end', name: '', lead: 2.4, tail: 10.0, lines: [
    ['这段影像是 AI 做的。', 1.0, { noSub: true }],
    ['它也不知道，那条线会不会弯。', 0, { noSub: true }],
  ]},
];

function lineDur(s) { return 0.45 + s.replace(/\s/g, '').length / RATE; }

let TOTAL = 0;
const CUES = [];
(function buildTimeline() {
  let t = 0;
  for (const ch of CHAPTERS) {
    ch.s = t; t += ch.lead; ch.cues = [];
    for (const [text, after, opt] of ch.lines) {
      const d = lineDur(text);
      const cue = { text, s: t, e: t + d, noSub: !!(opt && opt.noSub) };
      ch.cues.push(cue); CUES.push(cue);
      t += d + GAP + (after || 0);
    }
    t += ch.tail; ch.e = t;
  }
  TOTAL = t;
})();

/* ---------------- 小工具 ---------------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));       // 线性 0..1
const eprog = (t, a, b) => ease(prog(t, a, b));
const fin = (t, a, d = .6) => clamp((t - a) / d);           // 淡入
const vis = (t, a, b, d = .5) => fin(t, a, d) * (1 - fin(t, b - d, d));
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// 每帧收集：笔是否在画、打字机打了几个字（供声音使用）
const FX = { pen: 0, typed: 0 };

function setFont(size, family = SERIF, weight = 400) { ctx.font = `${weight} ${size}px ${family}`; }
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  setFont(o.size || 32, o.font || SERIF, o.weight || 400);
  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.rot) { ctx.translate(x, y); ctx.rotate(o.rot); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
// 打字机：返回已出现的部分，并登记打字数
function typed(s, p) {
  const chars = Array.from(s);
  const n = Math.floor(chars.length * clamp(p));
  if (p > 0 && p < 1) FX.typed += n;
  return chars.slice(0, n).join('');
}

// 路径：点列 + 累计长度，可按进度画出（笔尖跟随）
function mkPath(pts) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, L, len: L[L.length - 1] };
}
function sample(fn, a, b, n) { const out = []; for (let i = 0; i <= n; i++) { const u = a + (b - a) * i / n; out.push(fn(u)); } return out; }
function drawPath(P, p, o = {}) {
  if (p <= 0) return null;
  p = clamp(p);
  const target = P.len * p, pts = P.pts;
  ctx.save();
  ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w || 3;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  let tip = pts[0];
  for (let i = 1; i < pts.length; i++) {
    if (P.L[i] <= target) { ctx.lineTo(pts[i][0], pts[i][1]); tip = pts[i]; }
    else {
      const k = (target - P.L[i - 1]) / (P.L[i] - P.L[i - 1] || 1);
      tip = [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)];
      ctx.lineTo(tip[0], tip[1]); break;
    }
  }
  ctx.stroke();
  ctx.restore();
  if (p < 1 && !o.noNib) { nib(tip[0], tip[1], o.alpha); FX.pen++; }
  return tip;
}
function nib(x, y, a = 1) {
  ctx.save(); ctx.globalAlpha *= (a == null ? 1 : a);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function line(x1, y1, x2, y2, p = 1, o) { return drawPath(mkPath([[x1, y1], [x2, y2]]), p, o); }
function rectPath(x, y, w, h) { return mkPath([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]]); }
function circlePath(cx, cy, r, a0 = -Math.PI / 2) { return mkPath(sample(u => [cx + r * Math.cos(a0 + u), cy + r * Math.sin(a0 + u)], 0, Math.PI * 2, 48)); }

/* ---------------- 纸 ---------------- */
const grain = document.createElement('canvas');
(function makeGrain() {
  grain.width = 480; grain.height = 270;
  const g = grain.getContext('2d'), img = g.createImageData(480, 270);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = hash(i * .37) * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 14;
  }
  g.putImageData(img, 0, 0);
})();
function paper(t, gridAlpha = 1) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  const breathe = (0.85 + 0.15 * Math.sin(t * 0.45)) * gridAlpha;
  ctx.save(); ctx.globalAlpha = breathe; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 24) { ctx.strokeStyle = x % 120 === 0 ? C.gridMajor : C.grid; ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 24) { ctx.strokeStyle = y % 120 === 0 ? C.gridMajor : C.grid; ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
  ctx.restore();
  ctx.drawImage(grain, 0, 0, W, H);
}
function vignette() {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(60,40,10,0)'); v.addColorStop(1, 'rgba(60,40,10,0.22)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
// 荧光笔一抹：略歪、两端不齐
function hl(x, y, w, h, p, a = 1) {
  if (p <= 0) return;
  const ww = w * clamp(p);
  ctx.save(); ctx.globalAlpha *= a; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = C.hl;
  ctx.beginPath(); ctx.moveTo(x + 2, y + 4); ctx.lineTo(x + ww, y); ctx.lineTo(x + ww + 5, y + h - 3); ctx.lineTo(x - 3, y + h); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// 路径上某个进度处的点（镜头跟笔用）
function pathPoint(P, p) {
  const target = P.len * clamp(p);
  for (let i = 1; i < P.pts.length; i++) if (P.L[i] >= target) {
    const k = (target - P.L[i - 1]) / (P.L[i] - P.L[i - 1] || 1);
    return [lerp(P.pts[i - 1][0], P.pts[i][0], k), lerp(P.pts[i - 1][1], P.pts[i][1], k)];
  }
  return P.pts[P.pts.length - 1];
}

/* ---------------- Dylan He 的标志（按原图用代码重画） ---------------- */
const LOGO = (() => {
  const S = 600, cv2 = document.createElement('canvas'); cv2.width = cv2.height = S;
  const g = cv2.getContext('2d'), R0 = S * .46, ox = S / 2, oy = S / 2;
  const BLUE = '#4a62c4', ORANGE = '#ea7a3d', BROWN = '#4a2f36', CREAM = '#e9e2d1';
  const blob = (cx, cy, r, seed) => {
    g.beginPath();
    for (let i = 0; i <= 120; i++) {
      const a = i / 120 * Math.PI * 2;
      const rr = r * (1 + .016 * Math.sin(3 * a + seed) + .01 * Math.sin(5 * a + seed * 2.3) + .006 * Math.sin(9 * a + seed * .7));
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  };
  const P = (fx, fy) => [ox + fx * R0, oy + fy * R0];
  const solid = (fx, fy, fr, col, seed) => { const [x, y] = P(fx, fy); blob(x, y, fr * R0, seed); g.fillStyle = col; g.fill(); };
  const dots = (fx, fy, fr, bg, col, step, dr, seed) => {
    const [x, y] = P(fx, fy); blob(x, y, fr * R0, seed); g.fillStyle = bg; g.fill();
    g.save(); g.clip(); g.fillStyle = col;
    for (let yy = y - fr * R0; yy < y + fr * R0; yy += step) for (let xx = x - fr * R0; xx < x + fr * R0; xx += step) {
      g.beginPath(); g.arc(xx + (hash(xx * 3 + yy) - .5) * 1.2, yy + (hash(yy * 7 + xx) - .5) * 1.2, dr, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  };
  solid(0, 0, 1, BLUE, 1);
  dots(.02, -.01, .80, CREAM, BLUE, 9.5, 3.1, 2);
  dots(.10, -.04, .62, CREAM, ORANGE, 8.5, 2.9, 3);
  solid(.13, -.08, .42, ORANGE, 4);
  solid(.13, -.09, .30, BROWN, 5);
  dots(.17, -.10, .19, BROWN, BLUE, 7, 2.9, 6);
  solid(.18, -.14, .095, CREAM, 7);
  // 小人
  const [fx, fy] = P(-.565, .50), u = R0 * .01;
  g.fillStyle = BROWN;
  g.fillRect(fx - 4 * u, fy - 3 * u, 11 * u, 13 * u);
  g.fillRect(fx - 4 * u, fy + 9 * u, 4 * u, 13 * u); g.fillRect(fx + 3 * u, fy + 9 * u, 4 * u, 13 * u);
  g.fillStyle = ORANGE;
  g.beginPath(); g.arc(fx + 1.5 * u, fy - 8 * u, 4.2 * u, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(fx + 4 * u, fy + 1 * u, 3.6 * u, 0, Math.PI * 2); g.fill();
  // 颗粒
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 26000; i++) { g.fillStyle = hash(i * 1.7) > .5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.07)'; g.fillRect(hash(i) * S, hash(i + 5e4) * S, 1.4, 1.4); }
  return cv2;
})();
function logo(x, y, size, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.drawImage(LOGO, x - size / 2, y - size / 2, size, size); ctx.restore();
}

/* ---------------- 共用小画件 ---------------- */
function hourglass(x, y, s, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.lineTo(x + s, y + s); ctx.closePath();
  ctx.stroke(); ctx.restore();
}
function stamp(s, x, y, k, o = {}) {
  if (k <= 0) return;
  const sc = lerp(1.6, 1, ease(clamp(k * 3)));
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || -0.07); ctx.scale(sc, sc);
  ctx.globalAlpha *= clamp(k * 3) * 0.92;
  setFont(o.size || 60, SERIF, 600);
  const w = ctx.measureText(s).width + 56, h = (o.size || 60) + 34;
  ctx.fillStyle = 'rgba(239,231,214,0.9)'; ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.strokeStyle = C.red; ctx.lineWidth = 5; ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.lineWidth = 1.5; ctx.strokeRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16);
  ctx.fillStyle = C.red; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 4);
  ctx.restore();
}
// 线描小人（坐姿，面朝 dir），p 为画出进度
function figure(x, y, p, o = {}) {
  const d = o.dir || 1, a = o.alpha == null ? 1 : o.alpha, dash = o.dash;
  const parts = [
    circlePath(x, y - 150, 30),
    mkPath([[x, y - 120], [x - 6 * d, y - 30]]),                         // 躯干
    mkPath([[x - 2 * d, y - 100], [x + 50 * d, y - 70], [x + 95 * d, y - 72]]), // 手臂伸向桌面
    mkPath([[x - 6 * d, y - 30], [x + 55 * d, y - 30], [x + 55 * d, y + 50]]), // 腿
    mkPath([[x - 40 * d, y - 30], [x + 30 * d, y - 30]]),                 // 椅面
    mkPath([[x - 40 * d, y - 30], [x - 40 * d, y - 110]]),                // 椅背
    mkPath([[x - 32 * d, y - 30], [x - 32 * d, y + 50]]),                 // 椅腿
  ];
  const n = parts.length;
  parts.forEach((P, i) => {
    const k = clamp(p * n - i);
    const isChair = i >= 4;
    drawPath(P, k, { alpha: isChair ? (o.chairAlpha == null ? 1 : o.chairAlpha) : a, w: 3, dash: isChair ? null : dash, noNib: !(k > 0 && k < 1) });
  });
}
function desk(x1, x2, y, p) { line(x1, y, x2, y, p); line(x1 + 20, y, x1 + 20, y + 130, clamp(p * 2 - 1)); line(x2 - 20, y, x2 - 20, y + 130, clamp(p * 2 - 1)); }
function laptop(x, y, d, p, glow = 0) {
  drawPath(mkPath([[x - 40 * d, y], [x + 30 * d, y], [x + 50 * d, y - 60]]), p, { w: 3 });
  if (glow > 0) {
    ctx.save(); ctx.globalAlpha = glow * 0.9; ctx.strokeStyle = C.blue; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const ang = -Math.PI / 2 - d * (0.2 + i * 0.28);
      const r1 = 70, r2 = 70 + 26 + 10 * Math.sin(i * 2.1);

const GDP = (() => {
  const x0 = 220, x1 = 1440, x2 = 1700, yb = 850, yt = 290;
  const X = yr => x0 + (yr - 1870) / 140 * (x1 - x0);
  const rise = 2.8;                                   // 140 年 × 2% ≈ 对数 2.8
  const Y = v => yb - v / (rise + .25) * (yb - yt);
  function logv(yr) {
    let v = (yr - 1870) * 0.02;
    const dep = yr > 1929 && yr < 1945 ? Math.sin(prog(yr, 1929, 1941) * Math.PI) * -0.30 : 0;   // 大萧条
    const war = yr > 1939 && yr < 1950 ? Math.sin(prog(yr, 1939, 1950) * Math.PI) * 0.10 : 0;    // 二战
    const wob = Math.sin(yr * 0.9) * 0.018 + Math.sin(yr * 2.3 + 1) * 0.012;
    return v + dep + war + wob;
  }
  const main = mkPath(sample(yr => [X(yr), Y(logv(yr))], 1870, 2010, 280));
  const end = [X(2010), Y(logv(2010))];
  const straight = mkPath(sample(yr => [X(yr), Y(logv(2010) + (yr - 2010) * .02)], 2010, 2030, 40));
  const bend = mkPath(sample(yr => [X(yr), Y(logv(2010) + (yr - 2010) * .02 + Math.pow((yr - 2010) / 20, 3) * 0.55)], 2010, 2030, 40));
  const marks = [[1882, '电'], [1908, '汽车'], [1946, '电脑'], [1991, '互联网']];
  return { x0, x1, x2, yb, yt, X, Y, logv, main, end, straight, bend, marks };
})();
function drawGDP(lt, cfg) {
  const g = GDP;
  line(g.x0, g.yb + 40, g.x2, g.yb + 40, cfg.axis, { w: 2, noNib: true });
  line(g.x0 - 30, g.yb + 40, g.x0 - 30, g.yt - 60, cfg.axis, { w: 2, noNib: true });
  const ax = fin(cfg.axis, .9, .1);
  for (let yr = 1870; yr <= 2010; yr += 20) {
    ctx.save(); ctx.globalAlpha = ax; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(g.X(yr), g.yb + 40); ctx.lineTo(g.X(yr), g.yb + 52); ctx.stroke(); ctx.restore();
    text(String(yr), g.X(yr), g.yb + 82, { font: MONO, size: 22, align: 'center', color: C.ink2, alpha: ax });
  }
  if (!cfg.noLabel) text('人均 GDP · 对数刻度 · 示意', g.x0 - 20, g.yt - 80, { size: 24, color: C.ink2, alpha: ax });
  // 未来区域
  if (cfg.future > 0) {
    ctx.save(); ctx.globalAlpha = cfg.future * .5; ctx.strokeStyle = C.ink2; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(g.x1, g.yt - 60, g.x2 - g.x1, g.yb + 40 - (g.yt - 60)); ctx.clip();
    for (let k = -800; k < 800; k += 18) { ctx.beginPath(); ctx.moveTo(g.x1 + k, g.yt - 60); ctx.lineTo(g.x1 + k + 600, g.yb + 40); ctx.stroke(); }
    ctx.restore();
    text('2030', g.x2, g.yb + 82, { font: MONO, size: 22, align: 'center', color: C.ink2, alpha: cfg.future });
  }
  // 主线
  const tip = drawPath(g.main, cfg.main, { w: 4, noNib: cfg.main >= 1 });
  // 历史标注（笔经过时出现）
  for (const [yr, label] of g.marks) {
    const passed = tip ? tip[0] >= g.X(yr) : false;
    if (!passed && cfg.main < 1) continue;
    const k = cfg.markAlpha == null ? 1 : cfg.markAlpha;
    const x = g.X(yr), y = g.Y(g.logv(yr));
    ctx.save(); ctx.globalAlpha = k * .7; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x, y - 110); ctx.stroke(); ctx.restore();
    text(label, x, y - 124, { size: 34, align: 'center', alpha: k });
    text(String(yr), x, y - 162, { font: MONO, size: 20, align: 'center', color: C.ink2, alpha: k });
  }
  if (cfg.pct > 0) {
    text('≈ 2%', 300, 360, { font: MONO, size: 150, weight: 500, color: C.red, alpha: cfg.pct });
    text('每年 · 持续 140 年', 312, 430, { size: 36, color: C.ink2, alpha: cfg.pct });
  }
}

/* ---------------- 镜头：像有人俯身看图 ---------------- */
const CAMS = {
  title: (lt, ch) => ({ x: W / 2, y: H / 2, z: 1 + .035 * prog(lt, 0, ch.e - ch.s) }),
  ask: (lt, ch) => ({ x: W / 2, y: H / 2, z: 1.02 + .05 * prog(lt, 0, ch.e - ch.s) }),
  half(lt, ch) {
    const c = ch.cues.map(q => q.s - ch.s);
    const kA = eprog(lt, c[0], c[0] + 3) * (1 - eprog(lt, c[2] - 1, c[2] + 1.2));
    const kB = eprog(lt, c[2] - 1, c[2] + 1.2) * (1 - eprog(lt, c[4] + .2, c[4] + 1.6));
    return { x: W / 2 + kA * (520 - W / 2) + kB * (1400 - W / 2), y: 510, z: 1 + .28 * (kA + kB) };
  },
  chain(lt, ch) {
    const c = ch.cues.map(q => q.s - ch.s);
    // 每个小场景里缓慢推近
    const cuts = [0, c[2], c[5], c[6], ch.e - ch.s];
    let k = 0; for (let i = 0; i < 4; i++) if (lt >= cuts[i]) k = prog(lt, cuts[i], cuts[i + 1]);
    return { x: W / 2 + 30 * Math.sin(lt * .12), y: H / 2, z: 1.02 + .07 * ease(k) };
  },
  line(lt, ch) {
    const c = ch.cues.map(q => q.s - ch.s);
    const p = prog(lt, c[0] + .4, c[2] - .2);
    const tip = pathPoint(GDP.main, p);
    const k = eprog(lt, c[0] - .2, c[0] + 2.2) * (1 - eprog(lt, c[2] - 1.4, c[2] + 1.2));
    return { x: lerp(W / 2, tip[0], k), y: lerp(H / 2, tip[1] - 60, k), z: 1 + .55 * k };
  },
  swap(lt, ch) {
    const c = ch.cues.map(q => q.s - ch.s);
    const kA = eprog(lt, c[2], c[2] + 3.5) * (1 - eprog(lt, c[3] - 1, c[3]));
    const kB = eprog(lt, c[4], c[6] + 2);
    return { x: W / 2, y: lerp(H / 2, 470, kA), z: 1 + .14 * kA + .06 * kB };
  },
  end(lt, ch) {
    const k = 1 - eprog(lt, 0, ch.cues[1].s - ch.s + 4);
    return { x: lerp(W / 2, 1300, k), y: lerp(H / 2, 420, k), z: 1 + .35 * k };
  },
};
function applyCam(cam) {
  const z = Math.max(1, cam.z), hw = W / 2 / z, hh = H / 2 / z;
  const x = clamp(cam.x, hw, W - hw), y = clamp(cam.y, hh, H - hh);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-x, -y);
}

/* ---------------- 光：每章纸面色温不同，幅度很小 ---------------- */
const TINT = {
  title: [0, 0, 0, 0], ask: [255, 236, 200, .04], half: [120, 160, 210, .07], chain: [0, 0, 0, 0],
  line: [205, 160, 90, .05], swap: [245, 165, 80, .07], end: [200, 110, 60, .08],
};
function tint(t, ch, lt) {
  const i = CHAPTERS.indexOf(ch), prev = i > 0 ? TINT[CHAPTERS[i - 1].key] : TINT.title;
  const k = eprog(lt, 0, 2.5), cur = TINT[ch.key];
  let c = prev.map((v, j) => lerp(v, cur[j], k));
  if (ch.key === 'end') {   // 黄昏慢慢沉下去
    const d = eprog(lt, 2, ch.e - ch.s - 5);
    c = [lerp(c[0], 30, d), lerp(c[1], 34, d), lerp(c[2], 60, d), lerp(c[3], .32, d)];
  }
  if (c[3] <= 0.002) return;
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3] * 3})`; ctx.globalAlpha = .33; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
// 台灯：中心略亮的一圈暖光
function lamp(t) {
  const x = W * .46 + Math.sin(t * .07) * 40, y = H * .38;
  const g = ctx.createRadialGradient(x, y, 40, x, y, H * .9);
  g.addColorStop(0, 'rgba(255,244,214,0.16)'); g.addColorStop(1, 'rgba(255,244,214,0)');
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}

/* ---------------- 合成一帧 ---------------- */
function render(t) {
  FX.pen = 0; FX.typed = 0; FX.stamp = 0;
  t = clamp(t, 0, TOTAL);
  const ch = CHAPTERS.find(c => t >= c.s && t < c.e) || CHAPTERS[CHAPTERS.length - 1];
  const lt = t - ch.s;
  ctx.save();
  applyCam(CAMS[ch.key](lt, ch));
  paper(t, ch.key === 'title' ? .6 : 1);
  SCENES[ch.key](lt, ch);
  ctx.restore();
  if (ch.key === 'end') {   // 结尾的字不随镜头移动
    const c = ch.cues.map(q => q.s - ch.s);
    text(typed('这段影像是 AI 做的。', prog(lt, c[0], c[0] + 1.6)), 200, 220, { size: 54, weight: 600 });
    text(typed('它也不知道，那条线会不会弯。', prog(lt, c[1], c[1] + 2.6)), 200, 300, { size: 54, weight: 600 });
  }
  tint(t, ch, lt);
  lamp(t);
  vignette();
  if (ch.key === 'half') {   // 颜色图例只在第一次用色时出现
    const a = vis(lt, 1.5, ch.e - ch.s, .8);
    text('蓝 = AI 与预测', W - 70, 80, { size: 22, color: C.blue, align: 'right', alpha: a });
    text('红 = 访谈里的数字', W - 70, 112, { size: 22, color: C.red, align: 'right', alpha: a });
  }
  if (ch.name) text(ch.name, 70, 92, { font: SERIF, size: 26, color: C.ink2, alpha: vis(lt, .2, ch.e - ch.s, .6) });
  subtitle(t);
  const toNext = ch.e - t, sinceStart = lt;
  const wash = Math.max(1 - clamp(sinceStart / .5), 1 - clamp(toNext / .5));
  if (wash > 0 && ch.key !== 'title' && ch.key !== 'end') { ctx.save(); ctx.globalAlpha = wash * .9; ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  if (ch.key === 'end') {
    const D = ch.e - ch.s, blk = eprog(lt, D - 8.2, D - 5.8);
    if (blk > 0) { ctx.save(); ctx.globalAlpha = blk; ctx.fillStyle = '#0d0c0b'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    const cr = vis(lt, D - 5.4, D - .2, .8);
    logo(W / 2, H / 2 - 230, 200, cr);
    text('Dylan He', W / 2, H / 2 - 90, { font: MONO, size: 30, align: 'center', color: '#e9e2d1', alpha: cr });
    text('受哈佛大学政治研究所 JFK Jr. 论坛上 Peter McCrory 与 Jason Furman 的对话启发', W / 2, H / 2 + 6, { size: 26, align: 'center', color: '#bfb6a4', alpha: cr });
    text('新药、接力赛、实习生等例子及示意图为补充，不代表对话者观点', W / 2, H / 2 + 54, { size: 22, align: 'center', color: '#8a8273', alpha: cr });
    text('画面、声音与字幕全部由代码生成', W / 2, H / 2 + 94, { size: 22, align: 'center', color: '#8a8273', alpha: cr });
  }
}

/* ---------------- 声音：绘图仪步进 + 打字 + 盖章 + 纸面底噪 ---------------- */
const AU = { ctx: null, master: null, noise: null, nextTick: 0, lastTyped: 0, room: null };
function initAudio() {
  if (AU.ctx) return;
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  AU.ctx = ac; AU.master = ac.createGain(); AU.master.gain.value = .9; AU.master.connect(ac.destination);
  const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = w; }
  AU.noise = buf;
  // 底噪：低通的棕噪
  const brown = ac.createBuffer(1, len, ac.sampleRate), bd = brown.getChannelData(0); last = 0;
  for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
  const src = ac.createBufferSource(); src.buffer = brown; src.loop = true;
  const g = ac.createGain(); g.gain.value = 0; src.connect(g); g.connect(AU.master); src.start();
  AU.room = g;
}
function click(when, freq, q, gain, dur) {
  const ac = AU.ctx, s = ac.createBufferSource(); s.buffer = AU.noise;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.setValueAtTime(gain, when); g.gain.exponentialRampToValueAtTime(.0001, when + dur);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(when, Math.random() * 1.5, dur + .02);
}
function thump(when) {
  const ac = AU.ctx, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(120, when); o.frequency.exponentialRampToValueAtTime(45, when + .18);
  g.gain.setValueAtTime(.5, when); g.gain.exponentialRampToValueAtTime(.0001, when + .25);
  o.connect(g); g.connect(AU.master); o.start(when); o.stop(when + .3);
  click(when, 900, .8, .25, .08);
}
let stampDone = false;
function audioFrame(t, playing) {
  if (!AU.ctx) return;
  const now = AU.ctx.currentTime;
  const endFade = 1 - fin(t, TOTAL - 7, 2.5);
  AU.room.gain.setTargetAtTime(playing ? .05 * endFade : 0, now, .2);
  if (!playing) { AU.lastTyped = FX.typed; return; }
  if (FX.pen > 0) {
    if (AU.nextTick < now) AU.nextTick = now;
    while (AU.nextTick < now + .1) { click(AU.nextTick, 2400 + Math.random() * 600, 6, .07, .012); AU.nextTick += 1 / (14 * speed); }
  }
  if (FX.typed > AU.lastTyped) { const n = Math.min(3, FX.typed - AU.lastTyped); for (let i = 0; i < n; i++) click(now + i * .03, 3800, 3, .16, .03); }
  AU.lastTyped = FX.typed;
  if (FX.stamp && !stampDone) { thump(now); stampDone = true; }
  if (!FX.stamp && t < CHAPTERS[2].s) stampDone = false;
}

/* ---------------- 播放控制 ---------------- */
const stage = document.getElementById('stage');
const bar = { play: document.getElementById('play'), seek: document.getElementById('seek'), time: document.getElementById('time'), subs: document.getElementById('subs'), fs: document.getElementById('fs') };
const fill = bar.seek.querySelector('.fill');
for (const ch of CHAPTERS.slice(1)) { const m = document.createElement('div'); m.className = 'mark'; m.style.left = (ch.s / TOTAL * 100) + '%'; bar.seek.appendChild(m); }
let T = 0, playing = false, lastNow = 0, speed = 1;
const SPEEDS = [1, 1.5, 2, 3];
const params = new URLSearchParams(location.search);
if (params.has('t')) T = parseFloat(params.get('t')) || 0;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  stage.style.width = W * k + 'px'; stage.style.height = H * k + 'px';
}
addEventListener('resize', fit); fit();

function setPlaying(p) {
  playing = p; initAudio(); if (AU.ctx.state === 'suspended') AU.ctx.resume();
  if (p && T >= TOTAL) T = 0;
  bar.play.textContent = p ? '暂停' : '播放';
  stage.classList.toggle('paused', !p);
  document.getElementById('start').classList.add('hidden');
  lastNow = performance.now();
}
function loop(now) {
  if (playing) { T += (now - lastNow) / 1000 * speed; if (T >= TOTAL) { T = TOTAL; playing = false; setPlaying(false); } }
  lastNow = now;
  if (window.__frozen) return requestAnimationFrame(loop);
  render(T);
  audioFrame(T, playing);
  fill.style.width = (T / TOTAL * 100) + '%';
  bar.time.textContent = fmt(T) + ' / ' + fmt(TOTAL);
  requestAnimationFrame(loop);
}
document.getElementById('start').onclick = () => setPlaying(true);
bar.play.onclick = () => setPlaying(!playing);
const speedBtn = document.getElementById('speed');
function setSpeed(v) { speed = v; speedBtn.textContent = v + '×'; }
speedBtn.onclick = () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]);
if (params.has('speed') && SPEEDS.includes(+params.get('speed'))) setSpeed(+params.get('speed'));
bar.subs.onclick = () => { showSubs = !showSubs; bar.subs.textContent = '字幕 ' + (showSubs ? '开' : '关'); };
bar.fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
function seekTo(e) { const r = bar.seek.getBoundingClientRect(); T = clamp((e.clientX - r.left) / r.width) * TOTAL; AU.lastTyped = 1e9; }
bar.seek.addEventListener('pointerdown', e => { seekTo(e); const mv = ev => seekTo(ev); addEventListener('pointermove', mv); addEventListener('pointerup', () => removeEventListener('pointermove', mv), { once: true }); });
let uiTimer; stage.addEventListener('pointermove', () => { stage.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => stage.classList.remove('ui'), 1800); });
cv.addEventListener('click', () => setPlaying(!playing));
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight') { T = Math.min(TOTAL, T + 5); AU.lastTyped = 1e9; }
  if (e.code === 'ArrowLeft') { T = Math.max(0, T - 5); AU.lastTyped = 1e9; }
  if (e.code === 'KeyF') bar.fs.onclick();
  if (e.code === 'KeyC') bar.subs.onclick();
  if (e.code === 'KeyS') speedBtn.onclick();
  if (/^Digit[1-4]$/.test(e.code)) setSpeed(SPEEDS[+e.code.slice(5) - 1]);
});
// 供逐帧导出 / 检查使用
window.__twoPercent = { render, TOTAL, CHAPTERS, CUES };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(loop));
</script>
