<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互联网霸主更替</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111110;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8a8980;
    --axis: #55544f;
    /* 公司颜色：参考调色板暗色档，按固定顺序分配 */
    --aol: #3987e5;
    --yahoo: #199e70;
    --google: #c98500;
    --facebook: #d55181;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #stage.h { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
  #stage.v { height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; }
  svg { width: 100%; height: 100%; display: block; }
  text { fill: var(--text-primary); }
  #controls { position: fixed; left: 16px; bottom: 12px; display: flex; gap: 8px; align-items: center; color: var(--text-muted); font-size: 13px; opacity: 0; transition: opacity .3s; }
  body:hover #controls { opacity: 1; }
  #controls button { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"><svg id="svg" role="img" aria-label="AOL、Yahoo、Google、Facebook 市值对比，以及 AOL、Yahoo 后来的出售价格（亿美元）"></svg></div>
<div id="controls">
  <button id="play">暂停</button><button id="restart">重播</button><button id="ratio">切换横竖屏</button><button id="fs">全屏</button><span id="clock">0.0s</span>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";

// ---- 数据（均已核实，见 script/narration-v1.md）----
const V_MAX = 2000;
const STAGES = [
  { name: "第一阶段", desc: "基础设施：让人上网", cos: [0] },
  { name: "第二阶段", desc: "应用爆发", cos: [1] },
  { name: "第三阶段", desc: "原生应用", cos: [2, 3] },
];
const COS = [
  { co: "AOL",      v: 1630, yr: "2000", color: "var(--aol)",      exit: { v: 44,   yr: "2015 卖掉", pct: "−97%" } },
  { co: "Yahoo",    v: 1200, yr: "2000", color: "var(--yahoo)",    exit: { v: 48,   yr: "2016 卖掉", pct: "−96%" } },
  { co: "Google",   v: 1870, yr: "2007", color: "var(--google)" },
  { co: "Facebook", v: 1040, yr: "2012 上市", color: "var(--facebook)" },
];

// ---- 时间轴（秒）----
const T = { title: 0, s1: 2, s2: 8, s3: 14, fall: 22, quote: 33, end: 42 };
const GROW = 1.4, DRAIN = 2.2;

// ---- 两套版式：v 竖屏 1080×1920，h 横屏 1920×1080 ----
const LAYOUTS = {
  v: { W: 1080, H: 1920,
       title: { x: 540, y: [210, 310], size: 84, anchor: "middle" },
       caption: { x: 540, y: 470, size: 58 },
       plot: { x0: 60, x1: 1020, y0: 1560, top: 720, barW: 160 },
       label: { name: 56, value: 52, year: 38, gap: 18 },
       stageLabel: { y: 1640, size: 44 },
       pct: { size: 72 },
       quote: { x: 540, y: [190, 280, 390, 480], size: 66, by: 565 },
       source: { x: 540, y: [1790, 1840], size: 30 } },
  h: { W: 1920, H: 1080,
       title: { x: 960, y: [120], size: 76, anchor: "middle" },
       caption: { x: 960, y: 225, size: 52 },
       plot: { x0: 260, x1: 1660, y0: 880, top: 480, barW: 200 },
       label: { name: 60, value: 52, year: 36, gap: 16 },
       stageLabel: { y: 950, size: 44 },
       pct: { size: 76 },
       quote: { x: 960, y: [110, 195], size: 64, by: 262 },
       source: { x: 960, y: [1040], size: 28 } },
};
const TEXT = {
  title: { v: ["每个阶段的霸主", "都没赢下一个阶段"], h: ["每个阶段的霸主，都没赢下一个阶段"] },
  quote: { v: ["「第一阶段的企业，", "很难活到第二阶段；", "第二阶段的企业，", "很难活到第三阶段。」"],
           h: ["「第一阶段的企业，很难活到第二阶段；", "第二阶段的企业，很难活到第三阶段。」"] },
  source: { v: ["单位：亿美元", "数据：CNN、美国证监会文件、上市报道"], h: ["单位：亿美元　数据：CNN、美国证监会文件、上市报道"] },
};

const svg = document.getElementById("svg");
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function lines(arr, ys, attrs, parent) {
  const g = el("g", {}, parent);
  arr.forEach((s, i) => { el("text", { ...attrs, y: ys[i] }, g).textContent = s; });
  return g;
}

let L, ratio, N = {};
function build(r) {
  ratio = r; L = LAYOUTS[r];
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${L.W} ${L.H}`);
  document.getElementById("stage").className = r;
  const P = L.plot, h = v => v / V_MAX * (P.y0 - P.top);
  N.h = h;

  N.title = lines(TEXT.title[r], L.title.y, { x: L.title.x, "text-anchor": "middle", "font-size": L.title.size, "font-weight": 900 });
  N.caption = el("text", { x: L.caption.x, y: L.caption.y, "text-anchor": "middle", "font-size": L.caption.size, "font-weight": 700 });
  N.base = el("line", { x1: P.x0, x2: P.x1, y1: P.y0, y2: P.y0, stroke: "var(--axis)", "stroke-width": 3 });

  // 公司位置：四列等分
  const step = (P.x1 - P.x0) / COS.length;
  COS.forEach((c, i) => {
    c.cx = P.x0 + step * (i + 0.5);
    c.g = el("g", {});
    c.ghost = el("rect", { x: c.cx - P.barW / 2, width: P.barW, y: P.y0 - h(c.v), height: h(c.v), rx: 6,
      fill: "none", stroke: c.color, "stroke-width": 3, "stroke-dasharray": "10 10", opacity: 0 }, c.g);
    c.rect = el("rect", { x: c.cx - P.barW / 2, width: P.barW, y: P.y0, height: 0, rx: 6, fill: c.color }, c.g);
    c.label = el("g", { opacity: 0 }, c.g);
    c.nameEl = el("text", { x: c.cx, "text-anchor": "middle", "font-size": L.label.name, "font-weight": 700 }, c.label);
    c.nameEl.textContent = c.co;
    c.valEl = el("text", { x: c.cx, "text-anchor": "middle", "font-size": L.label.value, fill: "var(--text-secondary)" }, c.label);
    c.yrEl = el("text", { x: c.cx, "text-anchor": "middle", "font-size": L.label.year, fill: "var(--text-muted)" }, c.label);
    if (c.exit) {
      c.pctEl = el("text", { x: c.cx, y: P.y0 - h(c.v) / 2, "text-anchor": "middle", "font-size": L.pct.size, "font-weight": 900, fill: c.color, opacity: 0 }, c.g);
      c.pctEl.textContent = c.exit.pct;
    }
  });

  // 阶段名写在基线下方，第三阶段横跨两列
  STAGES.forEach(s => {
    const xs = s.cos.map(i => COS[i].cx);
    s.el = el("text", { x: (xs[0] + xs[xs.length - 1]) / 2, y: L.stageLabel.y, "text-anchor": "middle",
      "font-size": L.stageLabel.size, "font-weight": 500, fill: "var(--text-secondary)", opacity: 0 });
    s.el.textContent = s.name;
  });

  N.quote = el("g", { opacity: 0 });
  lines(TEXT.quote[r], L.quote.y, { x: L.quote.x, "text-anchor": "middle", "font-size": L.quote.size, "font-weight": 700 }, N.quote);
  el("text", { x: L.quote.x, y: L.quote.by, "text-anchor": "middle", "font-size": L.quote.size * 0.6, fill: "var(--text-secondary)" }, N.quote).textContent = "—— 曾鸣";
  N.source = lines(TEXT.source[r], L.source.y, { x: L.source.x, "text-anchor": "middle", "font-size": L.source.size, fill: "var(--text-muted)" });
}

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = t => 1 - Math.pow(1 - t, 3);
const fade = (t, t0, d = 0.6) => clamp((t - t0) / d);
const fmt = v => Math.round(v).toLocaleString("en-US");
const appearAt = i => {
  const s = STAGES.findIndex(st => st.cos.includes(i));
  return [T.s1, T.s2, T.s3][s] + 0.6 + STAGES[s].cos.indexOf(i) * 1.6;
};

function render(t) {
  const P = L.plot, h = N.h;
  const quoteIn = ease(fade(t, T.quote, 1.2));
  N.title.setAttribute("opacity", fade(t, T.title, 1) * (1 - fade(t, T.s1 - 0.4, 0.4)));

  // 当前字幕
  let cap = "", capT = 0;
  if (t >= T.s1 && t < T.fall) { const s = t < T.s2 ? 0 : t < T.s3 ? 1 : 2; cap = STAGES[s].name + "：" + STAGES[s].desc; capT = [T.s1, T.s2, T.s3][s]; }
  else if (t >= T.fall && t < T.quote) { cap = "后来呢？"; capT = T.fall; }
  N.caption.textContent = cap;
  N.caption.setAttribute("opacity", fade(t, capT, 0.5));

  const focus = ease(fade(t, T.fall, 1));
  COS.forEach((c, i) => {
    const g = ease(clamp((t - appearAt(i)) / GROW));
    let v = c.v * g, yrText = c.yr, drain = 0;
    if (c.exit) {
      const k = COS.filter(x => x.exit).indexOf(c);
      const d0 = T.fall + 1.2 + k * 3.2;
      drain = ease(clamp((t - d0) / DRAIN));
      v = v - (c.v - c.exit.v) * drain;
      if (drain > 0) yrText = c.exit.yr;
      c.ghost.setAttribute("opacity", drain > 0 ? 0.8 : 0);
      c.pctEl.setAttribute("opacity", fade(t, d0 + DRAIN - 0.3, 0.5));
    }
    const hh = h(v);
    c.rect.setAttribute("y", P.y0 - hh);
    c.rect.setAttribute("height", hh);
    c.g.setAttribute("opacity", c.exit ? 1 : 1 - 0.75 * focus);
    c.label.setAttribute("opacity", clamp(g * 2));
    c.valEl.textContent = fmt(v) + " 亿";
    c.yrEl.textContent = yrText;
    // 标签跟着柱顶走；漏空后留在峰值轮廓上方，不随柱子掉下去
    const top = P.y0 - (c.exit && drain > 0 ? h(c.v) : hh);
    const lg = L.label;
    c.yrEl.setAttribute("y", top - lg.gap);
    c.valEl.setAttribute("y", top - lg.gap - lg.year - 8);
    c.nameEl.setAttribute("y", top - lg.gap - lg.year - lg.value - 16);
  });
  STAGES.forEach((s, k) => s.el.setAttribute("opacity", fade(t, [T.s1, T.s2, T.s3][k], 0.5) * (1 - 0.6 * focus * (k === 2))));

  N.caption.setAttribute("opacity", +N.caption.getAttribute("opacity") * (1 - quoteIn));
  N.quote.setAttribute("opacity", quoteIn);
  N.source.setAttribute("opacity", fade(t, T.s1, 1));
  document.getElementById("clock").textContent = t.toFixed(1) + "s";
}

// 播放控制；?ar=h 横屏（默认竖屏），?t=秒 定格到某一帧
const params = new URLSearchParams(location.search);
build(params.get("ar") === "h" ? "h" : "v");
let playing = !params.has("t"), offset = parseFloat(params.get("t") || 0), startAt = performance.now();
function now() { return playing ? offset + (performance.now() - startAt) / 1000 : offset; }
function frame() {
  const t = now();
  render(Math.min(t, T.end));
  if (t >= T.end && playing) { offset = T.end; playing = false; document.getElementById("play").textContent = "播放"; }
  requestAnimationFrame(frame);
}
document.getElementById("play").onclick = e => {
  if (playing) { offset = now(); playing = false; } else { if (offset >= T.end) offset = 0; startAt = performance.now(); playing = true; }
  e.target.textContent = playing ? "暂停" : "播放";
};
document.getElementById("restart").onclick = () => { offset = 0; startAt = performance.now(); playing = true; document.getElementById("play").textContent = "暂停"; };
document.getElementById("ratio").onclick = () => build(ratio === "v" ? "h" : "v");
document.getElementById("fs").onclick = () => document.documentElement.requestFullscreen?.();
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); document.getElementById("play").click(); } });
requestAnimationFrame(frame);
</script>
</body>
</html>
