const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, t0, d) => clamp((t - t0) / d);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(",")})`; };
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };

    [68, 94, 6.5, ["D", "D", "A", "A"], 0.013, 900],

    [120, 150, 5, ["Dm", "Bb", "Gm", "A"], 0.024, 800],
    [150, 176, 6.5, ["G", "A", "D", "D"], 0.018, 1600],
  ];
  for (const [a, b, len, seq, vel, warm] of SECTIONS)
    for (let t = a, i = 0; t < b - 0.5; t += len, i++) { const d = Math.min(len, b - t) + 1.2; ev(t, d, (w, o, r) => pad(CH[seq[i % seq.length]], vel, warm)(w, o, r, d), true); }

  // 浪：涌起 + 拍岸
  for (const w of WAVES) {
    const k = Math.min(1.0, w.amp / L.maxH), crash = w.t0 + w.dur * 0.42;
    ev(w.t0, w.dur * 0.6, noise(w.dur * 0.6, "lowpass", 220, 1500, 0.7, 0.06 + 0.22 * k, w.dur * 0.35));
    ev(crash, 2.2, noise(2.2 + k, "bandpass", 1800, 300, 0.6, 0.08 + 0.3 * k, 0.04));
    if (k > 0.8) ev(crash, 1.2, thump(90, 38, 0.35 * k, 1.2));
  }
  // 沙堡：起稿时轻笔声、堆沙时沙沙声、建成时一个拨弦音（越高越亮）
  const castleNote = { AOL: 78, YAHOO: 74, GOOGLE: 81, FACEBOOK: 73 };
  for (const c of MAIN) {
    ev(c.t0 - 1.1, 1.0, noise(1.0, "bandpass", 5200, 4200, 2, 0.012));
    ev(c.t0, 2.8, noise(2.8, "bandpass", 3200, 2400, 0.8, 0.035, 0.6));
    ev(c.t0 + 2.2, 1.6, pluck(castleNote[c.co], 0.11, 1.8));
    if (c.exit) {
      const tw = Math.min(...c.grains.map(g => g.tw));
      [81, 78, 76, 74, 71, 69, 66, 64].forEach((m, j) => ev(tw + 0.1 + j * 0.09, 1, pluck(m - (c.co === "YAHOO" ? 2 : 0), 0.07, 1.2)));
      ev(tw + 1.6, 2, pluck(45, 0.16, 2.4));
    }
  }
  // AI 两座沙堡
  [0, 1].forEach(i => { ev(54.1 + i * 1.4, 1.0, noise(1.0, "bandpass", 5200, 4200, 2, 0.012)); ev(55.1 + i * 1.4, 2.4, noise(2.4, "bandpass", 3200, 2400, 0.8, 0.03, 0.5)); ev(57.4 + i * 1.4, 1.5, pluck(78, 0.09, 1.6)); });
  // 同质化：同一个音不断重复，越来越弱
  for (let t = 68.6; t < 85; t += 0.5) ev(t, 0.6, pluck(69, 0.07 * (1 - (t - 68.6) / 20), 0.5));
  // 需求—能力网：每亮一个节点响一颗高音
  const PENTA = [86, 88, 90, 93, 95, 98];
  NET.nodes.forEach((n, i) => ev(n.t + 0.6, 1.5, bell(PENTA[i % PENTA.length], 0.045, 2.2)));
  ev(112, 6, noise(6, "highpass", 6000, 9000, 0.5, 0.012, 2));
  // 反方：开场闷响，之后低沉心跳
  ev(120.2, 1.6, thump(110, 34, 0.4, 1.6));
  ev(120.2, 1.8, noise(1.8, "lowpass", 900, 80, 0.7, 0.12, 0.02));
  for (let t = 124; t < 149; t += 1.25) { ev(t, 0.4, thump(62, 40, 0.16, 0.35)); ev(t + 0.28, 0.4, thump(58, 38, 0.1, 0.3)); }
  ev(125.5, 2.5, noise(2.5, "lowpass", 160, 400, 1, 0.08, 0.8));
  // 石头碎裂与重新立起
  for (let i = 0; i < 34; i++) { const t = 142.4 + (i * 0.618 % 1) * 2.4; ev(t, 0.06, noise(0.05 + (i % 3) * 0.02, "bandpass", 2400 + (i * 397 % 2000), 1800, 3, 0.05, 0.002)); }
  [74, 78, 81, 86].forEach((m, j) => ev(146.6 + j * 0.35, 1.5, bell(m, 0.05, 2)));
  // 收尾：新光点一声钟，署名时一个上行琶音
  ev(165.2, 5, bell(86, 0.09, 5)); ev(165.6, 5, bell(93, 0.05, 5));
  [62, 66, 69, 74].forEach((m, j) => ev(171.2 + j * 0.18, 3, pluck(m, 0.08, 3)));
  // 字幕：每条出现时轻轻一个音
  const CAPNOTE = [62, 66, 69, 71, 74];
  CAPS.forEach((c, ci) => ev(c.at + 0.3, 1.2, pluck(c.k === "counter" ? 57 : CAPNOTE[ci % 5], 0.05, 1.6)));
  SND.sort((a, b) => a.t - b.t);
}
function startSound() {
  if (AC) { AC.resume(); soundOn = true; return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  // 总音量提高，压缩器兼作限幅，防止手机外放破音
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.25;
  // 最后一道软限幅：tanh 曲线，输出不会超过 ±1
  const clip = AC.createWaveShaper(), curve = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; curve[i] = Math.tanh(1.3 * x) / Math.tanh(1.3); }
  clip.curve = curve; comp.connect(clip); clip.connect(AC.destination);
  MASTER = AC.createGain(); MASTER.gain.value = 1.35; MASTER.connect(comp);
  NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const ch = NOISE.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  // 海浪环境声：一直在响，浪越大越响、越亮
  const src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 400; lp.Q.value = 0.5;
  const g = AC.createGain(); g.gain.value = 0; src.connect(lp); lp.connect(g); g.connect(MASTER); src.start();
  OCEAN = { lp, g };
  soundOn = true; lastFt = null;
}
let BUSES = [], schedFt = 0, lastFt = null, lastAt = 0, lastSpeed = 1, wasPlaying = false;
function resetBus() {
  const at = AC.currentTime;
  for (const b of BUSES) { b.gain.setTargetAtTime(0, at, 0.03); setTimeout(() => b.disconnect(), 400); }
  BUS = AC.createGain(); BUS.gain.value = 1; BUS.connect(MASTER); BUSES = [BUS];
}
function audioTick(ft) {
  if (!soundOn || !AC || !SND.length) return;
  const at = AC.currentTime;
  if (!playing || ft >= TOTAL) {
    if (wasPlaying) resetBus();
    wasPlaying = false; lastFt = null;
    OCEAN.g.gain.setTargetAtTime(0, at, 0.15);
    return;
  }
  const expected = lastFt === null ? null : lastFt + (at - lastAt) * speed;
  if (!wasPlaying || speed !== lastSpeed || expected === null || Math.abs(ft - expected) > 0.3) {
    resetBus(); schedFt = ft;
    for (const e of SND) if (e.long && e.t < ft && e.t + e.d > ft) e.f(at, ft - e.t, speed);
  }
  const horizon = ft + 0.5 * speed;
  for (const e of SND) { if (e.t >= horizon) break; if (e.t >= schedFt) e.f(at + Math.max(0, (e.t - ft) / speed), 0, speed); }
  schedFt = horizon; lastFt = ft; lastAt = at; lastSpeed = speed; wasPlaying = true;
  // 海浪环境声跟着画面里的浪
  let wv = 0; for (const w of WAVES) wv = Math.max(wv, waveAmp(w, ft) / L.maxH);
  const inv = prog(ft, 120, 1.2) * (1 - prog(ft, 149.4, 1.2));
  OCEAN.g.gain.setTargetAtTime((0.035 + 0.1 * Math.min(1.2, wv)) * (1 - 0.5 * inv) * (ft > 172 ? 1 - prog(ft, 172, 4) : 1), at, 0.2);
  OCEAN.lp.frequency.setTargetAtTime((380 + 1500 * Math.min(1.2, wv) + 80 * Math.sin(ft * 0.6)) * (1 - 0.45 * inv), at, 0.2);
}
function enableSound() {
  if (!soundOn) startSound(); else { soundOn = false; AC.suspend(); }
  document.getElementById("snd").textContent = tr(soundOn ? "关闭声音" : "开启声音");
  document.getElementById("hint").classList.toggle("off", soundOn);
}

/* ================= 播放控制 ================= */
// ?ar=h 横屏（默认竖屏）；?t=秒 定格；?act=序号 从某一幕开始；?speed=1.5 倍速
const params = new URLSearchParams(location.search);
// 没指定横竖屏时按屏幕方向选：电脑横屏，手机竖屏
build(params.get("ar") === "h" || (!params.get("ar") && innerWidth > innerHeight) ? "h" : "v");
window.__wave = { TOTAL, ACTS };
const logoImg = new Image(); logoImg.onload = () => { LOGO = logoImg; }; logoImg.src = "logo.png";
const actsEl = document.getElementById("acts");
ACTS.forEach(([n, at], i) => { const b = document.createElement("button"); b.textContent = `${i}·${n}`; b.onclick = () => { offset = at; startAt = performance.now(); playing = true; document.getElementById("play").textContent = tr("暂停"); }; actsEl.appendChild(b); });
let playing = !params.has("t"), startAt = performance.now();
let offset = params.has("t") ? parseFloat(params.get("t")) : params.has("act") ? (ACTS[+params.get("act")] || [0, 0])[1] : 0;
let speed = [1, 1.5, 2, 3].includes(+params.get("speed")) ? +params.get("speed") : 1;
const now = () => playing ? offset + (performance.now() - startAt) / 1000 * speed : offset;
function setSpeed(s) { offset = now(); startAt = performance.now(); speed = s; document.querySelectorAll("#speeds button").forEach(b => b.classList.toggle("on", +b.dataset.s === s)); }
document.querySelectorAll("#speeds button").forEach(b => b.onclick = () => setSpeed(+b.dataset.s));
setSpeed(speed);
function frame() {
  const t = now();
  render(Math.min(t, TOTAL));
  audioTick(t);
  if (t >= TOTAL && playing) { offset = TOTAL; playing = false; document.getElementById("play").textContent = tr("播放"); }
  requestAnimationFrame(frame);
}
document.getElementById("play").onclick = e => { if (playing) { offset = now(); playing = false; } else { if (offset >= TOTAL) offset = 0; startAt = performance.now(); playing = true; } e.target.textContent = tr(playing ? "暂停" : "播放"); };
document.getElementById("snd").onclick = enableSound;
document.getElementById("hint").onclick = enableSound;
let uiTimer = 0;
cv.addEventListener("click", () => {
  document.body.classList.toggle("ui");
  clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove("ui"), 4000);
});
document.getElementById("controls").addEventListener("click", () => { clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove("ui"), 4000); });
document.getElementById("restart").onclick = () => { offset = 0; startAt = performance.now(); playing = true; document.getElementById("play").textContent = tr("暂停"); };
document.getElementById("ratio").onclick = () => { const t = now(); build(R === "v" ? "h" : "v"); buildSound(); offset = t; startAt = performance.now(); lastFt = null; };
document.getElementById("fs").onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); document.getElementById("play").click(); } });
// 立刻开播，不等字体；手写英文字体到了再重新排版（否则量到的是后备字体的宽度）
buildSound();
requestAnimationFrame(frame);
Promise.all(["500 40px Caveat", "700 40px Caveat"].map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  for (const k in LAYOUT_CACHE) delete LAYOUT_CACHE[k];
  buildSound();
}).catch(() => {});
</script>
