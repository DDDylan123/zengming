let L, R, W, H, G, S, K;

/* ================= 海浪 ================= */
// 每道浪：t0 开始，dur 时长，amp 高度（相对最高沙堡），reach 最远冲到的 x
let WAVES;
function makeWaves() {
  const m = L.maxH;
  WAVES = [
    { t0: 10, dur: 6, amp: 0.2 * m, reach: S - 220 },
    { t0: 37.5, dur: 8, amp: 1.12 * m, reach: -80 },
    { t0: 77.3, dur: 3.6, amp: 0.32 * m, reach: L.wall.x0 - 60 },
    { t0: 80.3, dur: 3.6, amp: 0.34 * m, reach: L.wall.x0 - 60 },
    { t0: 83.3, dur: 3.6, amp: 0.3 * m, reach: L.wall.x0 - 60 },
    { t0: 132, dur: 3.4, amp: 0.45 * m, reach: L.stone.x - 260 },
    { t0: 135.6, dur: 3.4, amp: 0.5 * m, reach: L.stone.x - 260 },
    { t0: 139.2, dur: 3.4, amp: 0.48 * m, reach: L.stone.x - 260 },
    { t0: 150.5, dur: 9, amp: 1.55 * m, reach: -250 },
  ];
}
function front(w, t) {
  const p = (t - w.t0) / w.dur;
  if (p <= 0 || p >= 1) return null;
  if (p < 0.6) return lerp(W + 160, w.reach, easeInOut(p / 0.6));
  return lerp(w.reach, S + 60, easeInOut((p - 0.6) / 0.4));
}
function waveAmp(w, t) { const p = (t - w.t0) / w.dur; return w.amp * smooth(0, 0.15, p) * (1 - smooth(0.55, 1, p)); }
// x 处海面高出海滩的高度
function waveH(x, t) {
  let h = 0;
  for (const w of WAVES) {
    const f = front(w, t); if (f === null || x < f) continue;
    const a = waveAmp(w, t), d = x - f;
    h = Math.max(h, a * (1 - Math.exp(-d / 55)) * (0.55 + 0.45 * Math.exp(-d / 500)) + a * 0.22 * Math.exp(-(((d - 45) / 40) ** 2)));
  }
  return h;
}
const groundY = x => G + Math.max(0, x - S) * L.slope;
const surfaceY = (x, t) => G + 6 - waveH(x, t) - 5 * Math.sin(x * 0.018 - t * 1.6) - 3 * Math.sin(x * 0.041 + t * 1.1);
// 浪头第一次越过 x 的时刻
function passTime(w, x) { for (let t = w.t0; t < w.t0 + w.dur * 0.6; t += 0.02) { const f = front(w, t); if (f !== null && f <= x + 20) return t; } return w.t0 + w.dur; }

/* ================= 沙堡 ================= */
function inCastle(dx, dy, w, h) {
  // dx：离中心的水平距离；dy：离地高度。旗尖的高度就是 h（市值），城堡本体都在它下面
  const ax = Math.abs(dx);
  const crenel = (x, top, step) => (Math.floor((x + 999) / step) % 2 === 0) ? top : top - step * 0.8;
  if (ax < w * 0.1 && dy < h * 0.15 && Math.hypot(ax / (w * 0.1), dy / (h * 0.15)) < 1.25) return false;   // 城门洞
  const bodyH = h * 0.48, sideW = w * 0.2, sideH = h * 0.66, midW = w * 0.16, midH = h * 0.86;
  if (ax <= w * 0.4 && dy <= crenel(dx, bodyH, w / 9)) return true;                        // 城墙 + 垛口
  if (ax >= w * 0.5 - sideW && ax <= w * 0.5 && dy <= crenel(dx, sideH, sideW / 2)) return true;   // 两侧塔楼
  if (ax <= midW && dy <= crenel(dx, midH, midW / 1.5)) return true;                     // 中间高塔
  if (ax <= 2 && dy <= h) return true;                                                   // 旗杆
  if (dx >= 0 && dx <= w * 0.2 && dy >= h * 0.9 && dy <= h && dx <= (h - dy) * 2.2 * w / h + 0) return true; // 小旗
  return false;
}
function sampleCastle(r, cx, w, h, dens) {
  const pts = [], n = Math.round(w * h * 0.75 / dens);
  let guard = 0;
  while (pts.length < n && guard++ < n * 8) {
    const dx = (r() - 0.5) * w, dy = r() * h;
    if (inCastle(dx, dy, w, h)) pts.push([cx + dx, G - dy]);
  }
  return pts;
}
function sampleDome(r, cx, w, h) { const dx = (r() - 0.5) * w, k = 1 - (2 * dx / w) ** 2; return [cx + dx, G - r() * h * k]; }

    }

  BEACH.sort((a, b) => a.h2x - b.h2x);
  const wl = L.wall, nW = BEACH.length, area = (wl.x1 - wl.x0) * wl.h, sp = Math.sqrt(area / nW);
  const cols = Math.ceil((wl.x1 - wl.x0) / sp), rows = Math.ceil(nW / cols);
  BEACH.forEach((g, k) => {
    const c = Math.floor(k / rows), rr = k % rows;
    g.wx = wl.x0 + (c + 0.5) * (wl.x1 - wl.x0) / cols + (r() - 0.5) * sp * 0.6;

  }
  STONE.forEach(s => { s.hy = Math.min(s.hy, G - 4); s.te = passTime(WAVES[8], s.hx) + r() * 0.5; });

  // 需求—能力网
  const nt = L.net; NET = { hub: [nt.cx, nt.cy], nodes: [], cross: [] };
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2 + r() * 0.3, rr = 0.45 + r() * 0.55;

  }

}

}

function drawSea(t, inv) {
  const c = L.cell, seaC = mix(C.blue, C.blueLight, inv);
  ctx.save();

    if (gy - sy > 30 && (col * 7 + Math.floor(t * 9)) % 5 === 0) { const ry = sy - 6 - ((col * 13) % 23); ctx.moveTo(x + 3, ry); ctx.arc(x, ry, 3, 0, Math.PI * 2); }

}
function drawSand(inv) {
  const c = L.cell;

  ctx.beginPath();

}
function grain(x, y, col, a) { ctx.globalAlpha = a; ctx.fillStyle = col ? C.ink : C.orange; ctx.fillRect(x - 1.6, y - 1.6, 3.4, 3.4); }

function drawMain(t) {
  ctx.save();

}

}
function drawStone(t, inv) {

// ?ar=h 横屏（默认竖屏）；?t=秒 定格；?act=序号 从某一幕开始；?speed=1.5 倍速
const params = new URLSearchParams(location.search);
build(params.get("ar") === "h" ? "h" : "v");
window.__wave = { TOTAL, ACTS };
const logoImg = new Image(); logoImg.onload = () => { LOGO = logoImg; }; logoImg.src = "logo.png";
const actsEl = document.getElementById("acts");
ACTS.forEach(([n, at], i) => { const b = document.createElement("button"); b.textContent = `${i}·${n}`; b.onclick = () => { offset = at; startAt = performance.now(); playing = true; document.getElementById("play").textContent = "暂停"; }; actsEl.appendChild(b); });
let playing = !params.has("t"), startAt = performance.now();
let offset = params.has("t") ? parseFloat(params.get("t")) : params.has("act") ? (ACTS[+params.get("act")] || [0, 0])[1] : 0;
let speed = [1, 1.5, 2, 3].includes(+params.get("speed")) ? +params.get("speed") : 1;
const now = () => playing ? offset + (performance.now() - startAt) / 1000 * speed : offset;
function setSpeed(s) { offset = now(); startAt = performance.now(); speed = s; document.querySelectorAll("#speeds button").forEach(b => b.classList.toggle("on", +b.dataset.s === s)); }
document.querySelectorAll("#speeds button").forEach(b => b.onclick = () => setSpeed(+b.dataset.s));
setSpeed(speed);
function frame() {
  const t = now();
  render(Math.min(t, TOTAL));
  if (t >= TOTAL && playing) { offset = TOTAL; playing = false; document.getElementById("play").textContent = "播放"; }
  requestAnimationFrame(frame);
}
document.getElementById("play").onclick = e => { if (playing) { offset = now(); playing = false; } else { if (offset >= TOTAL) offset = 0; startAt = performance.now(); playing = true; } e.target.textContent = playing ? "暂停" : "播放"; };
document.getElementById("restart").onclick = () => { offset = 0; startAt = performance.now(); playing = true; document.getElementById("play").textContent = "暂停"; };
document.getElementById("ratio").onclick = () => { const t = now(); build(R === "v" ? "h" : "v"); offset = t; startAt = performance.now(); };
document.getElementById("fs").onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); document.getElementById("play").click(); } });
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
