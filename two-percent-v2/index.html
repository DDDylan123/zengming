<html lang="zh-CN">
<head>

  #seek { flex:1; position:relative; height:22px; cursor:pointer; }

</style>
</head>
<body>
<div id="stage" class="paused">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="start"><span>▶ 播放（含声音）</span></div>
  <div id="bar">
    <button id="play">播放</button>
    <div id="seek"><div class="track"></div><div class="fill"></div></div>
    <span id="time">0:00 / 0:00</span>
    <button id="speed">1×</button>
    <button id="subs">字幕 开</button>
    <button id="fs">全屏</button>
  </div>
</div>
<script>

/* ------------------------------ 角色部件（本片自己的造型：圆眼、圆手、小靴子） ------------------------------ */

// 真配乐：music.mp3（Eleven Music V3）。有它时撤掉代码合成的小乐队，只留拟音
const USE_MUSIC = true;
const BAND = new Set(['tuba', 'banjo', 'brush', 'trumpet', 'clarinet', 'trombone', 'piano', 'tick', 'stinger']);
async function loadMusic() {
  if (!USE_MUSIC) return;
  try { const r = await fetch('music.mp3'); if (r.ok) { AU.musicBuf = await AU.ctx.decodeAudioData(await r.arrayBuffer()); if (playing) startMusic(T, speed); } } catch (e) { }
}
function stopMusic() { if (AU.musicSrc) { try { AU.musicSrc.stop(); } catch (e) { } AU.musicSrc = null; } }
function startMusic(T, rate) {
  stopMusic(); if (!AU.musicBuf || !AU.bus || T >= AU.musicBuf.duration) return;
  const s0 = AU.ctx.createBufferSource(), gn = AU.ctx.createGain(); s0.buffer = AU.musicBuf; s0.playbackRate.value = rate;
  const left = DUR - T;   // 片尾随画面一起淡出
  gn.gain.setValueAtTime(.62, AU.ctx.currentTime); gn.gain.setValueAtTime(.62, AU.ctx.currentTime + Math.max(0, left - 2.5) / rate); gn.gain.linearRampToValueAtTime(0, AU.ctx.currentTime + left / rate);
  s0.connect(gn); gn.connect(AU.bus); s0.start(AU.ctx.currentTime + .03, T); AU.musicSrc = s0;
}
async function loadVO() {
  if (!VO_META) return;
  await Promise.all(VO.map(async (v, i) => {
    try { const r = await fetch(`vo/${String(i + 1).padStart(2, '0')}.mp3`); VOBUF[i] = await AU.ctx.decodeAudioData(await r.arrayBuffer()); } catch (e) { }
  }));
}
function newBus() { for (const k of ['bus', 'voBus']) if (AU[k]) { try { AU[k].disconnect(); } catch (e) { } } AU.bus = AU.ctx.createGain(); AU.bus.gain.value = 1; AU.bus.connect(AU.out); AU.voBus = AU.ctx.createGain(); AU.voBus.connect(AU.master); }
function env2(gn, w, a, peak, d) { gn.gain.setValueAtTime(0, w); gn.gain.linearRampToValueAtTime(peak, w + a); gn.gain.exponentialRampToValueAtTime(.0001, w + a + d); }
function osc(type, f, w, dur, peak, o = {}) {
  const ac = AU.ctx, os = ac.createOscillator(), gn = ac.createGain(); os.type = type; os.frequency.setValueAtTime(f, w);
  if (o.glide) os.frequency.exponentialRampToValueAtTime(o.glide, w + dur);
  if (o.vib) { const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = o.vib; lg.gain.value = f * .012; lfo.connect(lg); lg.connect(os.frequency); lfo.start(w); lfo.stop(w + dur + .1); }
  let node = os;
  if (o.lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; node.connect(fl); node = fl; }
  if (o.bp) { const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = o.bp; fl.Q.value = o.q || 2; node.connect(fl); node = fl; }
  node.connect(gn); gn.connect(AU.bus);
  env2(gn, w, o.a ?? .01, peak, dur); os.start(w); os.stop(w + dur + .2);
}
function noise(w, dur, peak, o = {}) {
  const ac = AU.ctx, s = ac.createBufferSource(), gn = ac.createGain(); s.buffer = AU.noise; s.loop = true;
  const fl = ac.createBiquadFilter(); fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 2000, w); fl.Q.value = o.q || 1;
  if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, w + dur);
  s.connect(fl); fl.connect(gn); gn.connect(AU.bus);
  if (o.flat) { gn.gain.setValueAtTime(0, w); gn.gain.linearRampToValueAtTime(peak, w + .05); gn.gain.setValueAtTime(peak, w + dur - .1); gn.gain.linearRampToValueAtTime(0, w + dur); }
  else env2(gn, w, o.a ?? .005, peak, dur);
  s.start(w, Math.random()); s.stop(w + dur + .2);
}
const PLAY = {
  tuba: (w, e, r) => osc('square', NOTE(e.n), w, .28 / r, .2, { lp: 520, a: .015 }),   // 巴松
  banjo: (w, e, r) => e.ns.forEach((n, i) => osc('triangle', NOTE(n), w + i * .02 / r, .14 / r, .09)),   // 尤克里里
  brush: (w, e, r) => noise(w, .06 / r, .05 * e.v, { f: 8000, q: .6, type: 'highpass' }),   // 沙锤
  trumpet: (w, e, r) => osc('sawtooth', NOTE(e.n), w, e.d / r, .12, { bp: 1100, q: 2.5, a: .03, vib: 6.5 }),   // 卡祖笛
  clarinet: (w, e, r) => { osc('sine', NOTE(e.n + 12), w, Math.min(e.d / r, .9), e.soft ? .1 : .14, { a: .003 }); osc('sine', NOTE(e.n + 12) * 2.76, w, .25, e.soft ? .03 : .045, { a: .002 }); },   // 玩具钢琴
  trombone: (w, e, r) => osc('sawtooth', NOTE(e.n), w, e.d / r, .12, { lp: 900, a: .05, glide: e.fall ? NOTE(e.n - 7) : null }),
  piano: (w, e, r) => { osc('triangle', NOTE(e.n), w, e.d / r, .14); osc('sine', NOTE(e.n + 12), w, e.d * .5 / r, .04); },
  xylo: (w, e, r) => e.ns.forEach((n, i) => osc('sine', NOTE(n + 12), w + i * .08 / r, .25 / r, .16)),
  woodblock: (w) => { osc('sine', 820, w, .07, .3); noise(w, .02, .2, { f: 2500, q: 3 }); },
  tick: (w, e) => osc('sine', 1300, w, .04, .14 * e.v),
  stinger: (w, e, r) => { [72, 76, 79, 84].forEach((n, i) => osc('sine', NOTE(n), w + i * .03, .5 / r, .1)); osc('square', NOTE(48), w, .3 / r, .12, { lp: 500 }); },
  shade: (w, e, r) => { noise(w, .7 / r, .16, { f: 3000, f2: 600, q: 1 }); osc('sine', 160, w + .7 / r, .12, .2); },   // 纸飘落
  scratch: (w, e, r) => { for (let i = 0; i < e.d * 9 / r; i++) noise(w + i * .11 / r + Math.random() * .03, .07, .08, { f: 3500 + Math.random() * 1500, q: 4 }); },
  boing: (w, e, r) => { const ac = AU.ctx, os = ac.createOscillator(), gn = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain(); os.frequency.value = 180; lfo.frequency.value = 14; lg.gain.setValueAtTime(90, w); lg.gain.exponentialRampToValueAtTime(1, w + .6 / r); lfo.connect(lg); lg.connect(os.frequency); os.connect(gn); gn.connect(AU.bus); env2(gn, w, .005, .3, .6 / r); os.start(w); lfo.start(w); os.stop(w + .8); lfo.stop(w + .8); },
  slide: (w, e, r) => osc('sine', e.up ? 500 : 1500, w, e.d / r, .14, { glide: e.up ? 1600 : 400, vib: 6 }),
  ding: (w) => { osc('sine', 1760, w, 1.2, .18); osc('sine', 2640, w, .6, .06); },
  honk: (w) => { osc('sawtooth', 330, w, .22, .14, { bp: 900, q: 2, a: .02 }); osc('sawtooth', 415, w, .22, .12, { bp: 900, q: 2, a: .02 }); },
  ring: (w) => { for (let i = 0; i < 6; i++) osc('square', 1400, w + i * .06, .04, .05, { bp: 1400, q: 3 }); },
  roll: (w, e, r) => { for (let i = 0; i < e.d * 20 / r; i++) noise(w + i * .05 / r, .05, .06 + i * .003, { f: 3000, q: 1 }); },
  whoosh: (w, e, r) => noise(w, e.d / r, .3, { f: 300, f2: 4000, q: .8, type: 'bandpass', a: .2 }),
  slap: (w) => { noise(w, .12, .5, { f: 1500, q: .7 }); osc('sine', 120, w, .1, .3); },
  paper: (w) => { for (let i = 0; i < 8; i++) noise(w + i * .06, .05, .12, { f: 4000 + i * 200, q: 2 }); },
  sand: (w, e, r) => noise(w, e.d / r, .06 * e.v, { f: 6000, q: .5, flat: true, type: 'highpass' }),
  creak: (w) => osc('sawtooth', 140, w, .3, .06, { bp: 700, q: 6, glide: 110, a: .05 }),
  stop: () => { },
  vo: (w, e, r) => {
    const buf = VOBUF[e.i]; if (!buf) return;
    const ac = AU.ctx, s0 = ac.createBufferSource(), gn = ac.createGain(); s0.buffer = buf; s0.playbackRate.value = r;
    gn.gain.value = 1.1; s0.connect(gn); gn.connect(AU.voBus); s0.start(w);
    const len = buf.duration / r;
    AU.bus.gain.setTargetAtTime(.4, w - .05, .06); AU.bus.gain.setTargetAtTime(1, w + len, .25);
  },
};
function schedule(now, playing, speed) {
  if (!AU.ctx || !playing) return;
  const ahead = .6, tNow = now;
  while (AU.idx < EV.length && EV[AU.idx].t < tNow + ahead * speed) {
    const e = EV[AU.idx++];
    if (e.t < tNow - .05) continue;
    if (AU.musicBuf && BAND.has(e.k)) continue;
    const w = AU.ctx.currentTime + (e.t - tNow) / speed + .03;
    try { PLAY[e.k](w, e, speed); } catch (err) { }
  }
}
function resetSchedule(t) { AU.idx = 0; while (AU.idx < EV.length && EV[AU.idx].t < t) AU.idx++; if (AU.ctx) { stopMusic(); newBus(); if (playing) startMusic(t, speed); } }

/* ------------------------------ 播放器 ------------------------------ */
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
mainG = cv.getContext('2d');
sceneCv = document.createElement('canvas'); sceneCv.width = W; sceneCv.height = H;
const bar = { play: document.getElementById('play'), seek: document.getElementById('seek'), time: document.getElementById('time'), subs: document.getElementById('subs'), fs: document.getElementById('fs'), speed: document.getElementById('speed') };
const fillEl = bar.seek.querySelector('.fill');
const params = new URLSearchParams(location.search);
let T = +(params.get('t') || 0), playing = false, lastNow = 0, speed = 1;
const SPEEDS = [1, 1.5, 2, 3];
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.width = W * k + 'px'; stage.style.height = H * k + 'px'; }
addEventListener('resize', fit); fit();
function setPlaying(p) {
  playing = p; initAudio(); if (AU.ctx.state === 'suspended') AU.ctx.resume();
  if (p && T >= DUR - .05) T = 0;
  resetSchedule(T);
  AU.bed.forEach((gn, i) => gn.gain.setTargetAtTime(p ? [.012, .05][i] : 0, AU.ctx.currentTime, .1));
  bar.play.textContent = p ? '暂停' : '播放'; stage.classList.toggle('paused', !p);
  document.getElementById('start').classList.add('hidden'); lastNow = performance.now();
}
function setSpeed(v) { speed = v; bar.speed.textContent = v + '×'; resetSchedule(T); }
function loop(now) {
  if (playing) { T += (now - lastNow) / 1000 * speed; if (T >= DUR) { T = DUR; setPlaying(false); } }
  lastNow = now;
  if (!window.__frozen) { render(T); schedule(T, playing, speed); }
  fillEl.style.width = (T / DUR * 100) + '%'; bar.time.textContent = fmt(T) + ' / ' + fmt(DUR);
  requestAnimationFrame(loop);
}
document.getElementById('start').onclick = () => setPlaying(true);
bar.play.onclick = () => setPlaying(!playing);
bar.speed.onclick = () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]);
bar.subs.onclick = () => { showSubs = !showSubs; bar.subs.textContent = '字幕 ' + (showSubs ? '开' : '关'); };
bar.fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
function seekTo(e) { const r = bar.seek.getBoundingClientRect(); T = clamp((e.clientX - r.left) / r.width) * DUR; resetSchedule(T); }
bar.seek.addEventListener('pointerdown', e => { seekTo(e); const mv = ev => seekTo(ev); addEventListener('pointermove', mv); addEventListener('pointerup', () => removeEventListener('pointermove', mv), { once: true }); });
let uiTimer; stage.addEventListener('pointermove', () => { stage.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => stage.classList.remove('ui'), 1800); });
cv.addEventListener('click', () => setPlaying(!playing));
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight') { T = Math.min(DUR, T + 5); resetSchedule(T); }
  if (e.code === 'ArrowLeft') { T = Math.max(0, T - 5); resetSchedule(T); }
  if (e.code === 'KeyF') bar.fs.onclick();
  if (e.code === 'KeyC') bar.subs.onclick();
  if (e.code === 'KeyS') bar.speed.onclick();
  if (/^Digit[1-4]$/.test(e.code)) setSpeed(SPEEDS[+e.code.slice(5) - 1]);
});
if (params.has('speed') && SPEEDS.includes(+params.get('speed'))) setSpeed(+params.get('speed'));
window.__film = { render, DUR, VO, SHOTS };
(async () => {
  try { await document.fonts.ready; for (const f of [`700 40px ${LAT}`, `500 40px ${LAT}`, `40px ${ZH_TITLE}`, `600 40px ${ZH_SUB}`]) await document.fonts.load(f, '百分之二'); } catch (e) { }
  SKY = paintSky(); LOGO = paintLogo();
  window.READY = true;
  requestAnimationFrame(loop);
})();
</script>
